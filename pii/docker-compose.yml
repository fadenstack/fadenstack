services:
  api: &main_app
    build:
      context: .
      dockerfile: ./Dockerfile
    image: faden_pii:${FADEN_PII_VERSION:-latest}
    restart: always
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      rmq:
        condition: service_healthy
    environment:
      FADEN_PII_HOST: 0.0.0.0
      FADEN_PII_BACKEND_URL: ${FADEN_PII_BACKEND_URL:-http://host.docker.internal:8000}
      FADEN_PII_RABBIT_HOST: faden_pii-rmq
      FADEN_PII_REDIS_HOST: faden_pii-redis

  taskiq-worker:
    <<: *main_app
    labels: []
    command:
      - taskiq
      - worker
      - faden_pii.tkq:broker

  redis:
    image: bitnami/redis:6.2.5
    hostname: "faden_pii-redis"
    restart: always
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    healthcheck:
      test: redis-cli ping
      interval: 1s
      timeout: 3s
      retries: 50

  rmq:
    image: rabbitmq:3.9.16-alpine
    hostname: "faden_pii-rmq"
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
      RABBITMQ_DEFAULT_VHOST: "/"
    healthcheck:
      test: rabbitmq-diagnostics check_running -q
      interval: 3s
      timeout: 3s
      retries: 50
