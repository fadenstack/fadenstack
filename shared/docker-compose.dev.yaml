services:
  faden-gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ../gateway:/app/src
    environment:
      FADEN_GATEWAY_RELOAD: "true"
    command:
      - /usr/local/bin/python
      - -m
      - faden_gateway

  # Optional: RAG service dev overrides (only started with --profile rag)
  faden-rag:
    profiles: ["rag"]
    build:
      context: ../faden_rag
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ../faden_rag:/app/src
    environment:
      FADEN_RAG_RELOAD: "true"
    command:
      - /usr/local/bin/python
      - -m
      - faden_rag

  faden-rag-worker:
    profiles: ["rag"]
    build:
      context: ../faden_rag
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ../faden_rag:/app/src
    command:
      - taskiq
      - worker
      - faden_rag.tkq:broker
      - --reload

  faden-rag-scheduler:
    profiles: ["rag"]
    build:
      context: ../faden_rag
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ../faden_rag:/app/src
    command:
      - /usr/local/bin/python
      - -m
      - faden_rag.workers.scheduler

  # Optional: PII service dev overrides (only started with --profile pii)
  faden-pii:
    profiles: ["pii"]
    build:
      context: ../pii
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ../pii:/app/src
    environment:
      FADEN_PII_RELOAD: "true"
    command:
      - /usr/local/bin/python
      - -m
      - faden_pii

  faden-pii-worker:
    profiles: ["pii"]
    build:
      context: ../pii
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ../pii:/app/src
    command:
      - taskiq
      - worker
      - faden_pii.tkq:broker
      - --reload

  # Optional: Mailer service dev overrides (only started with --profile mailer)
  faden-mailer:
    profiles: ["mailer"]
    build:
      context: ../faden_mailer
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ../faden_mailer:/app/src
    environment:
      FADEN_MAILER_RELOAD: "true"
    command:
      - /usr/local/bin/python
      - -m
      - faden_mailer
