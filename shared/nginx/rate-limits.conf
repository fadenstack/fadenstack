# Fadenstack -- how often one address may try to sign in.
#
# Included at http level by nginx.conf and nginx-tls.conf; the limit_req
# lines are in locations.conf (/api/). Each zone counts only the requests
# its key is set for: every other request has an empty key, which nginx
# does not count. $uri is the normalised path, so /api//auth/... and
# %-encoded spellings count the same.
#
# Per client address, and generous on purpose: an office behind one
# address, or an install whose Docker proxy hands nginx a single address
# for everyone, shares one count. Over the limit nginx answers 429 at
# once (nodelay) and the next try a few seconds later goes through.
#
#   faden_signin   console and API sign-in, and every step of a sign-in with
#                  an outside provider: 20 a minute, 20 at once.
#   faden_account  forgotten and reset passwords, e-mail verification and
#                  bootstrap: 10 a minute, 10 at once.
#   faden_refresh  agents renewing their tokens: 300 a minute, 200 at once.
#                  Each running agent renews about every 10 minutes
#                  (FADEN_BACKEND_AGENT_ACCESS_TOKEN_TTL_S); the SDKs keep
#                  their sign-in on a 429 and try again on the next call.
#   faden_public_check  the public page that checks pictures and files for
#                  AI-generated marks, without an account: 10 a minute, 10 at
#                  once (the backend counts the same per process; this is the
#                  one count for every process).

map "$request_method $uri" $faden_signin_key {
    default "";
    "~^POST /api/auth/(jwt|cookie)/login$" $binary_remote_addr;
    "~^GET /api/auth/sso/[a-z0-9-]+/(start|callback)$" $binary_remote_addr;
    "~^POST /api/auth/sso/[a-z0-9-]+/(acs|password)$" $binary_remote_addr;
}

map "$request_method $uri" $faden_account_key {
    default "";
    "~^POST /api/auth/(forgot-password|reset-password|request-verify-token|verify)$" $binary_remote_addr;
    "~^POST /api/bootstrap$" $binary_remote_addr;
}

map "$request_method $uri" $faden_refresh_key {
    default "";
    "~^POST /api/agent-tokens/refresh$" $binary_remote_addr;
}

map "$request_method $uri" $faden_public_check_key {
    default "";
    "~^POST /api/public/provenance/check$" $binary_remote_addr;
}

limit_req_zone $faden_signin_key  zone=faden_signin:10m  rate=20r/m;
limit_req_zone $faden_account_key zone=faden_account:10m rate=10r/m;
limit_req_zone $faden_refresh_key zone=faden_refresh:10m rate=300r/m;
limit_req_zone $faden_public_check_key zone=faden_public_check:10m rate=10r/m;
limit_req_status 429;
limit_req_log_level warn;
