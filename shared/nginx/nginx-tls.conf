# Fadenstack — nginx reverse proxy, HTTPS
#
# Installed by select-config.sh when the install's ./tls directory holds
# edge.crt and edge.key: uploaded through the console's TLS admin API,
# or copied in by the operator (docs/installing.md, "Enabling HTTPS").
# Plain HTTP then answers the container health check and sends
# everything else to HTTPS. The routes are in locations.conf.
#
# __HTTPS_PORT_SUFFIX__ and __HSTS_MAX_AGE__ are filled in by
# select-config.sh from FADEN_HTTPS_PORT and FADEN_HSTS_MAX_AGE.

# No nginx version in the Server header or on error pages.
server_tokens off;

# Limits on sign-in and account requests (limit_req in locations.conf).
include /etc/nginx/faden/rate-limits.conf;

# WebSocket connection upgrade map (must precede server block)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # The container health check, answered here so it never depends on TLS.
    location /healthz {
        access_log off;
        return 200 'ok';
    }

    # 307, not 301: browsers keep a 301 for good, so after HTTPS is switched
    # off again they would still go to a port nothing answers on. 307 also
    # keeps the method and body, which a POST to /v1 needs.
    location / {
        return 307 https://$host__HTTPS_PORT_SUFFIX__$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # edge.crt followed by edge-chain.pem (when present), put together by
    # select-config.sh: nginx wants the leaf and its chain in one file.
    ssl_certificate     /etc/nginx/faden-tls/fullchain.pem;
    ssl_certificate_key /etc/faden/tls/edge.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:faden_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS is opt-in: FADEN_HSTS_MAX_AGE in .env (Help: HTTPS). Off by default,
    # max-age=0, which also tells browsers to forget an earlier one. Many
    # installs run on a self-signed certificate or a private CA, and while a
    # host is under HSTS a browser offers no way past a certificate warning:
    # every browser that does not yet trust that CA would be locked out, and
    # so would anyone after HTTPS is switched off again.
    add_header Strict-Transport-Security "max-age=__HSTS_MAX_AGE__" always;
    include /etc/nginx/faden/security-headers.conf;

    # Docker embedded DNS — re-resolve container IPs dynamically so
    # restarting an upstream container doesn't require an nginx restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Max upload size (file attachments, RAG documents)
    client_max_body_size 100m;

    location /healthz {
        access_log off;
        return 200 'ok';
    }

    include /etc/nginx/faden/locations.conf;
}
