# Fadenstack — the routes behind the front door.
#
# Shared by the plain-HTTP server (nginx.conf) and the HTTPS server
# (nginx-tls.conf), which include this file; select-config.sh decides
# which of the two runs. Every upstream is a Docker service name and is
# re-resolved, so a restarted container needs no nginx restart.
#
# Host is passed as the client sent it ($http_host, port included): on
# ports other than 80/443 ($host drops the port) the backend built its own
# address without it, and the install line sent machines to the wrong port.
#
# X-Forwarded-For is set, not appended to: nginx is the front door, so the
# address it sees is the client's. Appended, a client could put any address
# first, and the backend and gateway -- which trust these headers
# (FORWARDED_ALLOW_IPS=*: nothing but this proxy reaches them from outside)
# -- took that one for the audit log, rate limits and a machine's address.
# X-Forwarded-Proto is always nginx's own $scheme for the same reason.
#
# Maintenance: while ./nginx/maintenance.flag exists -- put down by
# `faden upgrade` for its restart, or by `faden maintenance on` -- every
# route answers 503: pages with maintenance.html, which reloads itself once
# the platform is back, and the APIs with JSON saying so. /api/health stays
# open, so the CLI can tell when the backend is up before lifting it. A
# service that does not answer at all (502/504) gets the same page.
# X-Faden-Maintenance says which: "maintenance" while the flag is down (the
# console then reloads into the page), "unavailable" for a service down.
#
# Security headers (security-headers.conf) come from the server block; a
# location with add_header lines of its own includes them again, as nginx
# would otherwise drop them there.

# ── Maintenance ───────────────────────────────────────────────
location = /_faden/maintenance.html {
    internal;
    set $faden_down unavailable;
    if (-f /etc/nginx/faden/maintenance.flag) {
        set $faden_down maintenance;
    }
    alias /etc/nginx/faden/maintenance.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 30 always;
    add_header X-Faden-Maintenance $faden_down always;
    include /etc/nginx/faden/security-headers.conf;
}

# Why the page is up (the flag's JSON: reason, since, message); 404 when it is
# not down -- the page then says a service is not answering.
location = /_faden/maintenance.json {
    alias /etc/nginx/faden/maintenance.flag;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/faden/security-headers.conf;
}

location @faden_maintenance_api {
    set $faden_down unavailable;
    if (-f /etc/nginx/faden/maintenance.flag) {
        set $faden_down maintenance;
    }
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 30 always;
    add_header X-Faden-Maintenance $faden_down always;
    include /etc/nginx/faden/security-headers.conf;
    return 503 '{"detail":"Fadenstack is not available right now: it is being updated, under maintenance or restarting. Try again in a minute.","maintenance":"$faden_down"}';
}

location @faden_maintenance_openai {
    set $faden_down unavailable;
    if (-f /etc/nginx/faden/maintenance.flag) {
        set $faden_down maintenance;
    }
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 30 always;
    add_header X-Faden-Maintenance $faden_down always;
    include /etc/nginx/faden/security-headers.conf;
    return 503 '{"error":{"message":"Fadenstack is not available right now: it is being updated, under maintenance or restarting. Try again in a minute.","type":"service_unavailable","code":"$faden_down"}}';
}

# Too many sign-in or account requests from one address (rate-limits.conf):
# JSON, as every other /api answer.
location @faden_too_many {
    default_type application/json;
    add_header Retry-After 60 always;
    include /etc/nginx/faden/security-headers.conf;
    return 429 '{"detail":"Too many attempts from this address. Wait a minute, then try again."}';
}

# ── Backend health (/api/health) ──────────────────────────────
# Open during maintenance: `faden upgrade` waits on it to lift the flag.
location = /api/health {
    set $backend http://faden-backend:8000;
    proxy_pass $backend;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
}

# ── Backend API (/api/*) ──────────────────────────────────────
# The frontend calls /api/* with httponly cookies.
location /api/ {
    if (-f /etc/nginx/faden/maintenance.flag) {
        return 503;
    }
    # Only nginx's own: what the backend answers passes as it is.
    error_page 502 503 = @faden_maintenance_api;
    # Sign-in, password and token requests, per address; the rest is not
    # counted (rate-limits.conf).
    limit_req zone=faden_signin burst=20 nodelay;
    limit_req zone=faden_account burst=10 nodelay;
    limit_req zone=faden_refresh burst=200 nodelay;
    limit_req zone=faden_public_check burst=10 nodelay;
    error_page 429 = @faden_too_many;
    set $backend http://faden-backend:8000;
    proxy_pass $backend;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;

    # SSE streaming: disable buffering
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # WebSocket support (if needed)
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}

# ── Backend API docs (/api/docs, /api/redoc, /api/openapi.json) ─
# The schema lists every route of the admin API, so it is for a signed-in
# console session only: the same check as /grafana/ (/_console_access/grafana
# below). A regex location wins over the /api/ prefix above.
location ~ ^/api/(docs|redoc|openapi\.json)$ {
    if (-f /etc/nginx/faden/maintenance.flag) {
        return 503;
    }
    error_page 502 503 = @faden_maintenance_api;
    auth_request /_console_access/grafana;
    set $backend http://faden-backend:8000;
    proxy_pass $backend;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
}

# ── OpenAI-compatible API (/v1/*) ─────────────────────────────
# External API clients (curl, SDKs) can hit /v1/* through the
# same origin instead of needing a separate port.
location /v1/ {
    if (-f /etc/nginx/faden/maintenance.flag) {
        return 503;
    }
    error_page 502 503 = @faden_maintenance_openai;
    set $gateway http://faden-gateway:8000;
    proxy_pass $gateway;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;

    # SSE streaming
    proxy_buffering off;
    proxy_cache off;
    # A whole answer arrives only once it is written: a little longer than the
    # gateway waits for one (non_stream_timeout_sec), so the client hears why.
    proxy_read_timeout 1260s;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}

# ── Gateway static assets (Swagger UI / ReDoc JS+CSS) ───────
# The gateway serves JS/CSS from /static/docs/*. This location
# makes those assets reachable via /gateway-static/* so the
# rewritten HTML (see sub_filter below) can load them.
location /gateway-static/ {
    set $gw_static http://faden-gateway:8000;
    rewrite ^/gateway-static/(.*)$ /static/$1 break;
    proxy_pass $gw_static;
    proxy_set_header Host              $http_host;
}

# ── Gateway API docs (iframe-friendly path) ──────────────────
# Proxies /gateway-docs/* → faden-gateway /api/*
location /gateway-docs/ {
    # Signed-in console sessions only, as for the backend's docs above.
    auth_request /_console_access/grafana;
    set $gateway_docs http://faden-gateway:8000;
    rewrite ^/gateway-docs/(.*)$ /api/$1 break;
    proxy_pass $gateway_docs;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;

    # Rewrite absolute asset paths in Swagger/ReDoc HTML so they
    # load through /gateway-static/ and /gateway-docs/ instead of
    # hitting the backend (/api/) or the frontend catch-all (/static/).
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter '/static/docs/' '/gateway-static/docs/';
    sub_filter '/api/openapi.json' '/gateway-docs/openapi.json';
}

# ── Grafana (proxied for remote access) ────────────────────
# Only for a console session allowed to read observability data: Grafana's
# anonymous viewer can query any data source (/grafana/api/ds/query), so
# without this every log and metric was open to whoever reached this port.
# The console's embedded dashboards send the session cookie and pass.
location /grafana/ {
    if (-f /etc/nginx/faden/maintenance.flag) {
        return 503;
    }
    error_page 502 503 504 =503 /_faden/maintenance.html;
    auth_request /_console_access/grafana;
    set $grafana http://faden-grafana:3000;
    proxy_pass $grafana;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;

    # WebSocket support for Grafana Live
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}

location = /_console_access/grafana {
    internal;
    set $backend http://faden-backend:8000;
    proxy_pass $backend/api/admin/observability/grafana-access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length    "";
    proxy_set_header Host              $http_host;
    proxy_set_header Cookie            $http_cookie;
    proxy_set_header Authorization     $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
}

# ── Frontend (everything else) ────────────────────────────────
# React SSR served by react-router-serve.
location / {
    if (-f /etc/nginx/faden/maintenance.flag) {
        return 503;
    }
    error_page 502 503 504 =503 /_faden/maintenance.html;
    set $frontend http://faden-frontend:3000;
    proxy_pass $frontend;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
