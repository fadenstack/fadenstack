# Fadenstack — nginx reverse proxy, plain HTTP
#
# Single public entrypoint unifying frontend + backend + API gateway
# under one origin so the frontend's relative-path API calls (/api/*)
# work from any browser, local or remote.
#
# This is the server nginx runs while no edge certificate is present.
# With one in the install's ./tls directory, select-config.sh installs
# nginx-tls.conf instead (docs/installing.md, "Enabling HTTPS"). The
# routes are in locations.conf, shared by both.

# WebSocket connection upgrade map (must precede server block)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Docker embedded DNS — re-resolve container IPs dynamically so
    # restarting an upstream container doesn't require an nginx restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Max upload size (file attachments, RAG documents)
    client_max_body_size 100m;

    # ── Health check (local only, no upstream) ────────────────────
    location /healthz {
        access_log off;
        return 200 'ok';
    }

    include /etc/nginx/faden/locations.conf;
}
