# Fadenstack -- security headers on every answer of the console's origin.
#
# Included at server level, and again in every location of locations.conf
# that has an add_header of its own: nginx drops the server's add_header
# lines in a location that sets any itself.

# Framing: only pages of this origin may frame these pages. The console
# frames Grafana (/grafana/) and the gateway's API docs (/gateway-docs/)
# itself, from the same origin; nothing else frames it, and no other site
# can put the console -- an approval button, say -- under a page of its own.
# X-Frame-Options for browsers that do not read the CSP.
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
# A link to another site does not tell it which console page it came from.
add_header Referrer-Policy "same-origin" always;

# The gateway sends its own copies of these (X-Frame-Options DENY on /v1).
# The edge's are the ones that count; the copies are dropped, not sent twice.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
