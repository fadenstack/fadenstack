# The Help site's settings. scripts/build.py fills in the #...# lines, for each language (its name, words and
# navigation) and for the public site (help.fadenstack.com) or /help in the console (the address, the links in
# the top bar, the language switch).
[project]
#SITE_NAME#
#SITE_URL#
#SITE_DESCRIPTION#
site_author = "Emagin8 UG (haftungsbeschränkt)"
docs_dir = "docs"
site_dir = "site"
#COPYRIGHT#
extra_css = ["assets/stylesheets/fonts.css", "assets/stylesheets/fadenstack.css"]
#NAV#

[project.extra]
site_key = "help"
github = "https://github.com/fadenstack"
#SITES#
#ALTERNATE#

[project.theme]
custom_dir = "overrides"
favicon = "assets/images/favicon.svg"
logo = "assets/images/mark.svg"
#LANGUAGE#
font = false
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  #INSTANT#
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
