# Help, previewed on its own: `zensical serve` in docs/help. The branded site (help.fadenstack.com) is built by the
# docs hub (fadenstack/docs, `python scripts/assemble.py help`), which takes this nav as it is.
[project]
site_name = "Fadenstack Help"
site_description = "Using, administering and running Fadenstack."
docs_dir = "pages"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Use" = [
    { "Overview" = "use/index.md" },
    { "Chat" = "use/chat.md" },
    { "Tools in the chat" = "use/tools.md" },
    { "Skills" = "use/skills.md" },
    { "Knowledge" = "use/knowledge.md" },
    { "The browser agent" = "use/browser-agent.md" },
    { "Office add-ins" = "use/office-add-ins.md" },
    { "Checking content" = "use/checking-content.md" },
    { "Your account" = "use/account.md" },
    { "Your data and privacy" = "use/privacy.md" },
  ] },
  { "Administer" = [
    { "Overview" = "administer/index.md" },
    { "Users, groups and roles" = "administer/users.md" },
    { "Sign-in providers" = "administer/sign-in.md" },
    { "OpenID Connect" = "administer/sign-in-oidc.md" },
    { "SAML" = "administer/sign-in-saml.md" },
    { "Directories (LDAP, Active Directory)" = "administer/sign-in-ldap.md" },
    { "Models" = "administer/models.md" },
    { "Deployments" = "administer/deployments.md" },
    { "Remote providers" = "administer/providers.md" },
    { "MCP servers" = "administer/mcp-servers.md" },
    { "Skills for the organisation" = "administer/skills.md" },
    { "Agents and add-ins" = "administer/agents.md" },
    { "Policies and personal data" = "administer/policies.md" },
    { "Content marking" = "administer/content-marking.md" },
    { "What happens to a request" = "administer/requests.md" },
    { "Usage and costs" = "administer/usage.md" },
    { "LLM calls" = "administer/llm-calls.md" },
    { "The dashboard" = "administer/dashboard.md" },
  ] },
  { "Operate" = [
    { "Overview" = "operate/index.md" },
    { "System requirements" = "operate/requirements.md" },
    { "Installing" = "operate/installing.md" },
    { "Upgrading" = "operate/upgrading.md" },
    { "Preview releases" = "operate/preview.md" },
    { "Backups" = "operate/backups.md" },
    { "Rotating the keys" = "operate/rotating-keys.md" },
    { "HTTPS and trust" = "operate/https.md" },
    { "Network and ports" = "operate/network.md" },
    { "GPU machines" = "operate/machines.md" },
    { "Clusters" = "operate/clusters.md" },
    { "Existing vLLM servers" = "operate/existing-vllm.md" },
    { "Taking over clusters" = "operate/taking-over.md" },
    { "Failures and logs" = "operate/failures.md" },
    { "Containers" = "operate/containers.md" },
    { "Troubleshooting" = "operate/troubleshooting.md" },
    { "Third-party components" = "operate/third-party.md" },
  ] },
]

[project.theme]
# Fonts come from the theme (assets/stylesheets/fonts.css), never from Google Fonts.
font = false
language = "en"
features = ["navigation.tabs", "navigation.sections", "navigation.footer", "content.code.copy", "search.highlight"]

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.keys = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
