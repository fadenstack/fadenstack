services:
  api: &main_app
    build:
      context: .
      dockerfile: ./Dockerfile
    image: faden_gateway:${FADEN_GATEWAY_VERSION:-latest}
    restart: always
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      rmq:
        condition: service_healthy
    environment:
      FADEN_GATEWAY_HOST: 0.0.0.0
      FADEN_GATEWAY_RABBIT_HOST: faden_gateway-rmq
      FADEN_GATEWAY_REDIS_HOST: faden_gateway-redis

  taskiq-worker:
    <<: *main_app
    labels: []
    command:
      - taskiq
      - worker
      - faden_gateway.tkq:broker

  redis:
    image: bitnami/redis:6.2.5
    hostname: "faden_gateway-redis"
    restart: always
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    healthcheck:
      test: redis-cli ping
      interval: 1s
      timeout: 3s
      retries: 50

  rmq:
    image: rabbitmq:3.9.16-alpine
    hostname: "faden_gateway-rmq"
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
      RABBITMQ_DEFAULT_VHOST: "/"
    healthcheck:
      test: rabbitmq-diagnostics check_running -q
      interval: 3s
      timeout: 3s
      retries: 50


