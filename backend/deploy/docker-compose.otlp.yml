services:
  api:
    environment:
      # Adds opentelemetry endpoint.
      FADEN_BACKEND_OPENTELEMETRY_ENDPOINT: "http://otel-collector:4317"
  taskiq-worker:
    environment:
      # Adds opentelemetry endpoint.
      FADEN_BACKEND_OPENTELEMETRY_ENDPOINT: "http://otel-collector:4317"

  otel-stack:
    image: grafana/otel-lgtm
    hostname: "otel-collector"
    environment:
      # Its Grafana sends no usage reports and checks nothing against grafana.com.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    ports:
      # Collector's GRPC endpoint
      - "4317:4317"
      # Collector's HTTP endpoint
      - "4318:4318"
      # Grafana UI
      - "3000:3000"
