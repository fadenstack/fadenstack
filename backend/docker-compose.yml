services:
  api: &main_app
    build:
      context: .
      dockerfile: ./Dockerfile
    image: faden-backend:${FADEN_BACKEND_VERSION:-latest}
    restart: always
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
      rmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      FADEN_BACKEND_HOST: 0.0.0.0
      FADEN_BACKEND_DB_HOST: faden-backend-db
      FADEN_BACKEND_DB_PORT: 5432
      FADEN_BACKEND_DB_USER: faden_backend
      FADEN_BACKEND_DB_PASS: faden_backend
      FADEN_BACKEND_DB_BASE: faden_backend
      FADEN_BACKEND_RABBIT_HOST: faden-backend-rmq

  taskiq-worker:
    <<: *main_app
    labels: []
    command:
      - taskiq
      - worker
      - faden_backend.tkq:broker

  db:
    image: postgres:18.1-bookworm
    hostname: faden-backend-db
    environment:
      POSTGRES_PASSWORD: "faden_backend"
      POSTGRES_USER: "faden_backend"
      POSTGRES_DB: "faden_backend"
    volumes:
      - faden-backend-db-data:/var/lib/postgresql
    restart: always
    healthcheck:
      test: pg_isready -U faden_backend
      interval: 2s
      timeout: 3s
      retries: 40

  migrator:
    <<: *main_app
    restart: "no"
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  rmq:
    image: rabbitmq:4.2.1-management-alpine
    hostname: "faden-backend-rmq"
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
      RABBITMQ_DEFAULT_VHOST: "/"
    healthcheck:
      test: rabbitmq-diagnostics check_running -q
      interval: 3s
      timeout: 3s
      retries: 50



volumes:
  faden-backend-db-data:
    name: faden-backend-db-data
