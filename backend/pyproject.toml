[project]
name = "faden-backend"
version = "0.6.0rc4"
requires-python = ">=3.12,<4.0"
description = ""
authors = [
  { name = "Sachith Liyanagama", email = "liyanagama@outlook.de" },
]
maintainers = [
  { name = "Sachith Liyanagama", email = "liyanagama@outlook.de" },
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "fastapi >=0.122.0,<1",
  "uvicorn[standard] >=0.38.0,<1",
  "fastapi-users >=15.0.1,<16",
  "fastapi-users-db-sqlalchemy >=7.0.0,<8",
  "pydantic >=2.12.5,<3",
  "pydantic-settings >=2.14.2,<3",  # >=2.14.2: clears GHSA-4xgf-cpjx-pc3j
  "yarl >=1.22.0,<2",
  "ujson >=5.13.0",  # >=5.13.0: clears PYSEC-2026-2291/2292/2293/2294
  "SQLAlchemy[asyncio] >=2.0.44,<3",
  "alembic >=1.17.2,<2",
  "asyncpg >=0.31.0,<1",
  "aio-pika >=9.5.8,<10",  # <10: aio-pika 10 (pamqp 4) refuses the connection kwargs taskiq-aio-pika passes on
  "prometheus-client >=0.23.1,<1",
  "prometheus-fastapi-instrumentator >=8.1.0,<9",  # 7.x capped starlette<1.0; 8.x allows starlette 1.x (clears starlette CVEs)
  "sentry-sdk >=2.46.0,<3",
  "opentelemetry-api >=1.38.0,<2",
  "opentelemetry-sdk >=1.38.0,<2",
  "opentelemetry-exporter-otlp >=1.38.0,<2",
  "opentelemetry-instrumentation >=0.59b0,<1",
  "opentelemetry-instrumentation-fastapi >=0.59b0,<1",
  "opentelemetry-instrumentation-sqlalchemy >=0.59b0,<1",
  "opentelemetry-instrumentation-aio-pika >=0.59b0,<1",
  "loguru >=0.7.3,<1",
  "taskiq >=0.12.0,<1",
  "taskiq-fastapi >=0.5.0,<1",  # >=0.5.0: removes app.router.startup/shutdown calls, which crash-loop workers on starlette 1.x
  "taskiq-aio-pika >=0.5.0,<0.6",  # <0.6: 0.6 drops queue_name, and the backend would share the gateway's queue
  "aiodocker >=0.23.0,<1",
  "huggingface-hub >=0.27.0,<3",
  "hf-xet >=1.1.0,<2",
  "httpx >=0.28.1,<1",
  "psutil >=6.0.0,<8",
  "tzdata >=2025.2",  # zoneinfo data: Windows has no system tz database, and dashboard windows follow the viewer's zone
  "cryptography >=50.0.0",  # >=50.0.0: clears PYSEC-2026-35/36/3552/3553/3554
  "pynvml>=12.0.0,<14",
  "pdfplumber >=0.11.0,<1",
  "python-docx >=1.1.0,<2",
  "python-pptx >=1.0.0,<2",
  "openpyxl >=3.1.0,<4",
  "pgvector >=0.3.6,<1",
  "aiofiles >=24.1.0,<26",
  "python-multipart >=0.0.31",  # >=0.0.31: clears PYSEC-2026-3036/3037/3038/3039/3040
  # Transitive floors — uv lock is conservative (keeps previously locked versions), so each
  # floor is spelled out to force the vulnerable transitive versions up to the fix:
  "pillow>=13.0.0",  # >=13.0.0: GHSA-8g5g-8vmr-9782, GHSA-p4wg-p73j-c528 et al.
  "urllib3 >=2.8.0",  # >=2.8.0: clears PYSEC-2026-4175..4177
  "starlette >=1.3.1",  # >=1.3.1: clears starlette CVEs (requires instrumentator 8.x)
  "pyjwt >=2.15.0",  # >=2.15.0: clears PYSEC-2026-4140..4152/4183
  "lxml >=6.1.0",  # >=6.1.0: clears PYSEC-2026-87 / GHSA-vfmq-68hx-4jfw
  "aiohttp >=3.14.4",  # >=3.14.4: GHSA-2g87-pp6c-29x5, GHSA-5wr8-gcqf-gqf3
  "idna >=3.15",  # >=3.15: clears PYSEC-2026-215
  "requests >=2.33.0",  # >=2.33.0: clears PYSEC-2026-2275
  "mako >=1.3.12",  # >=1.3.12: clears PYSEC-2026-2617
  "click >=8.3.3",  # >=8.3.3: clears PYSEC-2026-2132
  "pygments >=2.20.0",  # >=2.20.0: clears PYSEC-2026-2987
  "python-dotenv >=1.2.2",  # >=1.2.2: clears PYSEC-2026-2270
  "certifi>=2026.10.19",  # >=2026.10.19: GHSA-6q48-6c7w-9gw2 (emSign roots with compromised intermediate keys)
]

[dependency-groups]
dev = [
  "pytest >=9.0.3,<10",  # >=9.0.3: clears PYSEC-2026-1845
  "ruff >=0.14.6,<1",
  "mypy >=1.19.0,<3",
  "pre-commit >=4.5.0,<5",
  "pytest-cov >=7.0.0,<8",
  "anyio >=4.14.2,<5",  # >=4.14.2: clears PYSEC-2026-4024/4025
  "pytest-env >=1.2.0,<2",
  "httpx >=0.28.1,<1",
  "taskiq[reload] >=0.12.0,<1",
]


[tool.uv]
default-groups = ["dev"]

[tool.isort]
profile = "black"
multi_line_output = 3
src_paths = ["faden_backend",]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_unused_ignores = false
warn_return_any = false
namespace_packages = true

[tool.pytest.ini_options]
addopts = "-p no:unraisableexception"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::fastapi.exceptions.FastAPIDeprecationWarning",
    "ignore:.*transaction already deassociated.*:sqlalchemy.exc.SAWarning",
    "ignore:.*unclosed.*:ResourceWarning",
]
anyio_mode = "auto"
env = [
    "FADEN_BACKEND_ENVIRONMENT=pytest",
    "FADEN_BACKEND_DB_BASE=faden_backend_test",
    "FADEN_BACKEND_SENTRY_DSN=",
]

[tool.ruff]
target-version = "py312"
# List of enabled rulsets.
# See https://docs.astral.sh/ruff/rules/ for more information.
lint.select = [ "E",     # Error
    "F",     # Pyflakes
    "W",     # Pycodestyle
    "C90",   # McCabe complexity
    "I",     # Isort
    "N",     # pep8-naming
    "D",     # Pydocstyle
    "ANN",   # Pytype annotations
    "S",     # Bandit
    "B",     # Bugbear
    "C4",    # Comprehensions
    "ISC",   # Implicit string concat
    "PIE",   # Unnecessary code
    "T20",   # Catch prints
    "PYI",   # validate pyi files
    "Q",     # Checks for quotes
    "RSE",   # Checks raise statements
    "RET",   # Checks return statements
    "SLF",   # Self checks
    "SIM",   # Simplificator
    "PTH",   # Pathlib checks
    "ERA",   # Checks for commented out code
    "PL",    # PyLint checks
    "RUF",   # Specific to Ruff checks
	"FA102", # Future annotations
	"UP",	 # Python updates
]
lint.ignore = [
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__
    "B008",    # Do not perform function calls in argument defaults
    "D211",    # No blank lines allowed before class docstring
    "D212",    # Multi-line docstring summary should start at the first line
    "D401",    # First line should be in imperative mood
    "D104",    # Missing docstring in public package
    "D100",    # Missing docstring in public module
    "D202",    # No blank lines allowed after function docstring
    "ANN401",  # typing.Any are disallowed in `**kwargs
    "PLR0913", # Too many arguments for function call
    "D106",    # Missing docstring in public nested class
]
lint.mccabe = { max-complexity = 10 }
exclude = [
    "faden_backend/db/migrations",
    ".venv/"
]
line-length = 110

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # Use of assert detected
    "PLC0415", # Import outside toplevel (intentional in test helpers)
    "D103",    # Missing docstring in public function
    "D205",    # Missing blank line after summary
    "E501",    # Line too long (long parametrize args and inline data are normal)
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str", "float", "bytes"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "taskiq_dependencies.Depends",
  "taskiq.TaskiqDepends",
  "fastapi.Depends",
  "fastapi.Query",
]

[fastapi-template.options]
project_name = "faden-backend"
api_type = "rest"
enable_redis = "None"
enable_rmq = "True"
ci_type = "none"
enable_migrations = "True"
enable_taskiq = "True"
enable_routers = "True"
enable_kafka = "None"
enable_loguru = "True"
traefik_labels = "None"
add_dummy = "True"
orm = "sqlalchemy"
self_hosted_swagger = "True"
prometheus_enabled = "True"
sentry_enabled = "True"
otlp_enabled = "True"
gunicorn = "None"
add_users = "True"
cookie_auth = "True"
jwt_auth = "True"
