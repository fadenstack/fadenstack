# llm.port — nginx reverse proxy, HTTPS
#
# Installed by select-config.sh when the install's ./tls directory holds
# edge.crt and edge.key: uploaded through the console's TLS admin API,
# or copied in by the operator (docs/installing.md, "Enabling HTTPS").
# Plain HTTP then answers the container health check and sends
# everything else to HTTPS. The routes are in locations.conf.
#
# __HTTPS_PORT_SUFFIX__ and __HSTS_MAX_AGE__ are filled in by
# select-config.sh from LLM_PORT_HTTPS_PORT and LLM_PORT_HSTS_MAX_AGE.

# WebSocket connection upgrade map (must precede server block)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # The container health check, answered here so it never depends on TLS.
    location /healthz {
        access_log off;
        return 200 'ok';
    }

    location / {
        return 301 https://$host__HTTPS_PORT_SUFFIX__$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # edge.crt followed by edge-chain.pem (when present), put together by
    # select-config.sh: nginx wants the leaf and its chain in one file.
    ssl_certificate     /etc/nginx/llmport-tls/fullchain.pem;
    ssl_certificate_key /etc/llmport/tls/edge.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:llmport_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # max-age=0, the default, tells browsers to forget any earlier HSTS,
    # so HTTPS can be switched off again without locking them out.
    add_header Strict-Transport-Security "max-age=__HSTS_MAX_AGE__" always;

    # Docker embedded DNS — re-resolve container IPs dynamically so
    # restarting an upstream container doesn't require an nginx restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Max upload size (file attachments, RAG documents)
    client_max_body_size 100m;

    location /healthz {
        access_log off;
        return 200 'ok';
    }

    include /etc/nginx/llmport/locations.conf;
}
