    highlights:
      - "Remote providers' API keys are stored encrypted, and `faden secrets rotate` changes the keys that seal stored data."
      - "Signing out ends that sign-in, and a password change ends all of them."
      - "An MCP tool call is refused when its personal-data check cannot run."
      - "Operators can no longer switch on remote code or other code-running engine settings, and an agent's tool limit holds when a tool runs."
      - "Chat attachments and, with a data folder, the knowledge base's files are copied and verified on upgrade; a conflict stops the upgrade instead of overwriting."
      - "New clusters encrypt their Ray traffic (Ray TLS) from the start."
      - "After an upgrade that changes a runtime's mounts, a cluster keeps serving and offers the new settings as Apply and restart."
      - "New machines install only the agent build this release pins, checked by its SHA-256."
      - "Docker's logs rotate, Redis has a memory cap, and backups and restores need no image from the internet."
      - "The DGX Spark runtime is built on vLLM's own image and mounts the machine's own model store and Hugging Face cache; the console runs on Node.js 24 LTS."
