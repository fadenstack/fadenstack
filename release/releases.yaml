# Every Fadenstack release, as the update check tells installs about it.
#
# release/update_feed.py turns this file into the signed feed at
# https://fadenstack.com/updates/v1/index.json, which every install reads once a day
# (docs/help/pages/operate/upgrading.md, "How you hear about a new release").
# Add a release's entry BEFORE tagging it: the release workflow refuses a tag without one.
#
# Per release:
#   version       the release (also the CLI's and the images' version)
#   channel       stable | preview (a pre-release such as 0.5.0rc1 must be preview)
#   date          YYYY-MM-DD; left empty, the build fills in the day it runs for the release it builds
#   severity      normal | security (fixes a security problem) | critical (upgrade now)
#                 Installs are told the most urgent severity of all releases newer than theirs.
#   summary       one line, English
#   highlights    optional: what is new, a line each, English (fadenstack.com/releases/ shows them)
#   notes_url     optional; default: the release on fadenstack.com/releases/
#   upgrade_from  optional: the oldest release that can upgrade straight to this one. `faden upgrade`
#                 refuses to skip it and names the release to install first.
#   fixes         optional: security problems fixed (id, severity, summary), once they may be public
#   components    versions released with it: agent (the backend's AGENT_VERSION)
#
# series: how long a minor series gets fixes. Past the day, its installs are told they are unsupported.
# Only state a day you mean to keep.

series: []

releases:
  - version: 0.4.4rc1
    channel: preview
    date: ""
    severity: security
    summary: >-
      Security and reliability: provider keys are encrypted, sign-ins end on logout, MCP's personal-data check
      fails closed, chat attachments are kept on a volume, and the keys that seal stored data can be rotated.
    highlights:
      - "Chat attachments are kept on a volume (or a directory of your choice), copied over and verified on upgrade, and part of the backup."
      - "Remote providers' API keys are stored encrypted, and `faden secrets rotate` changes the keys that seal stored data."
      - "Signing out ends that sign-in, and a password change ends all of them."
      - "An MCP tool call is refused when its personal-data check cannot run."
      - "Operators can no longer switch on remote code or other code-running engine settings, and an agent's tool limit holds when a tool runs."
      - "New machines install only the agent build this release pins, checked by its SHA-256."
      - "Docker's logs rotate, Redis has a memory cap, and backups keep each kind apart and check their volume archives."
      - "The DGX Spark runtime is built on vLLM's own image, and the console runs on Node.js 24 LTS."
    upgrade_from: 0.4.0
    components:
      agent: 0.2.9
  - version: 0.4.3
    channel: stable
    date: ""
    severity: normal
    summary: >-
      The machines' runtime images come with the release, a model a machine already holds is used where it is,
      and hybrid models such as Qwen3.8 start with the settings the console suggests.
    highlights:
      - "Runtime images for NVIDIA DGX Spark and x86 machines are published with the release: a new install can run models."
      - "A model in a machine's Hugging Face cache is used in place, also when other tools share that cache."
      - "Hybrid models (linear attention or Mamba, such as Qwen3.8) are planned with the memory each conversation needs, and start."
      - "A cluster taken over after a reinstall keeps its encrypted model traffic, and its models answer."
    upgrade_from: 0.4.0
    components:
      agent: 0.2.8
  - version: 0.4.2
    channel: stable
    date: "2026-10-11"
    severity: security
    summary: >-
      Security fixes: API tokens expire and can be revoked, the setup token lasts an hour, devices are
      checked again, and knowledge collections are read only by the people they are open to.
    highlights:
      - "Security: sign-in limits, no fixed logins or published secrets, and expired or revoked API tokens refused everywhere."
      - "Access checks on people search, chat attachments and knowledge collections."
      - "Ask first rules also hold for an agent's own tools."
      - "Personal data: tool arguments that cannot be redacted are not sent, and a chat can only make detection stricter."
      - "Pictures in the chat, sent only to models that take them."
      - "The console says when a new release is out, with the commands to upgrade."
    upgrade_from: 0.4.0
    components:
      agent: 0.2.7
