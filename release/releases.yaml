# Every Fadenstack release, as the update check tells installs about it.
#
# release/update_feed.py turns this file into the signed feed at
# https://fadenstack.com/updates/v1/index.json, which every install reads once a day
# (docs/help/pages/operate/upgrading.md, "How you hear about a new release").
# Add a release's entry BEFORE tagging it: the release workflow refuses a tag without one.
#
# Per release:
#   version       the release (also the CLI's and the images' version)
#   channel       stable | preview (a pre-release such as 0.5.0rc1 must be preview)
#   date          YYYY-MM-DD; left empty, the build fills in the day it runs for the release it builds
#   severity      normal | security (fixes a security problem) | critical (upgrade now)
#                 Installs are told the most urgent severity of all releases newer than theirs.
#   summary       one line, English
#   highlights    optional: what is new, a line each, English (fadenstack.com/releases/ shows them)
#   notes_url     optional; default: the release on fadenstack.com/releases/
#   upgrade_from  optional: the oldest release that can upgrade straight to this one. `faden upgrade`
#                 refuses to skip it and names the release to install first.
#   fixes         optional: security problems fixed (id, severity, summary), once they may be public
#   components    versions released with it: agent (the backend's AGENT_VERSION)
#
# series: how long a minor series gets fixes. Past the day, its installs are told they are unsupported.
# Only state a day you mean to keep.

series: []

releases:
  - version: 0.6.0rc3
    channel: preview
    date: ""
    severity: normal
    summary: >-
      A release candidate of 0.6.0, a Preview release: usage and limits with privacy by default, teams in a
      tree, settings changes in every backend process at once, requests to cloud models with the local PII
      detector on, faster answers in chats with skills, and security updates.
    highlights:
      - "A Preview release: `faden deploy` and `faden upgrade` say what that means and ask before they go on."
      - "With the PII module's local detector (its CPU and GPU modes), requests to cloud models are no longer all refused: the default policy looks for the types the installed detector finds. An install still on the earlier default gets the new one; a policy that does not fit the detector is named as such."
      - "Usage: My usage for everyone, with a download; a Usage page that shows figures only for groups of at least 5 people; per-person figures of others only for a usage auditor with a stated reason, and every look is recorded."
      - "Limits for the instance: requests per minute, tokens per minute and tokens per day, refused as OpenAI clients read it (429 with Retry-After and x-ratelimit headers)."
      - "Teams in a tree: a team's parent, cost centre and archiving; usage counts toward a person's home team and every team above it."
      - "Request records are kept 90 days and daily sums 25 months; deleting an account erases its request records. Nothing is deleted in the first 7 days after the upgrade."
      - "A settings change applies in every backend process at once, not only in the one that saved it."
      - "Each mail in the outbox goes out once, also with several backend workers. A forgotten password can be reset at addresses on .local and other internal domains."
      - "Chats with skills answer sooner: a turn's skills go into its question, so a model that takes one system message (Qwen 3.5 and later) no longer computes the whole conversation again when the skills change; the first word came 3 to 7 times sooner in tests."
      - "Agents can ask whether the policy allows a person's own command before they run it, and see whom they work for (for the Nextcloud agent's history commands)."
      - "A model whose servers are all down says so (503 model_unreachable, with Retry-After) instead of reading as not allowed; answers no longer carry invisible characters a model repeated; the Updates page reads the PII image's version."
      - "A request the services cannot read is refused without repeating what was sent (a password, a key, a text to scan); with a label allowlist for logs, a query's filters keep to it too."
      - "Security and maintenance updates: LiteLLM, FastAPI, the MCP SDK 2, huggingface-hub 2, aio-pika, taskiq, OpenTelemetry, React and others."
    upgrade_from: 0.4.0
    components:
      agent: 0.2.11
  - version: 0.5.1
    channel: stable
    date: ""
    severity: normal
    summary: >-
      The server comes back by itself after a reboot. API token use is recorded, and changes to a person's rights
      apply at once; with Fadenstack Enterprise, sign-in through your identity provider and provisioning.
    highlights:
      - "After a reboot the server comes back by itself: the message broker no longer runs out of memory while it starts, and the services wait for it instead of giving up."
      - "API tokens: every use is recorded, and Access Control, API tokens shows who used which token and when."
      - "A change to a person's rights applies at their next request and ends their sign-ins."
      - "Administrators can give a person a one-time link to set a new password, without mail."
      - "With Fadenstack Enterprise: sign-in through your organisation's identity provider (OpenID Connect, SAML with Single Logout, LDAP and Active Directory), provisioning from Entra ID, Okta and others (SCIM), linked sign-ins, and mail in each person's language."
      - "The gateway keeps an idle connection open longer than its clients do: no more occasional 502 answers. The MCP image runs Node.js 24 LTS."
    upgrade_from: 0.4.0
    components:
      agent: 0.2.11
  - version: 0.5.0
    channel: stable
    date: ""
    severity: security
    summary: >-
      A Preview release: content marking for the EU AI Act (Art. 50(2)), with chats answered only by models
      whose answers carry a mark; checking content, the local PII runtime, the LLM Calls page, and the GB10
      and x86_64 runtimes with vLLM 0.31. Security updates.
    highlights:
      - "A Preview release: `faden deploy` and `faden upgrade` say what that means and ask before they go on."
      - "Content marking, on by default: pictures carry signed C2PA content credentials, an invisible watermark and IPTC metadata; every text answer gets a signed receipt, and chat models on a runtime with vLLM 0.30 or later write a text watermark."
      - "Check content: everyone signed in can check a text, a picture or a file; the public check page for pictures and files is on by default."
      - "An edited copy of an answer is still found, by the fingerprint its receipt keeps."
      - "Chat models that watermark start without speculative decoding (MTP), with which the watermark did not hold."
      - "The GB10 runtime with vLLM 0.31.0, certified on the DGX Spark pair with its watermark, is the GB10 default."
      - "The x86_64 runtime with vLLM 0.31.0 writes the text watermark too, certified on an NVIDIA TITAN RTX: the x86_64 default."
      - "Before you upgrade: with content marking on, chats are refused for models that cannot mark their answers. Switch clusters to the runtime with vLLM 0.31, and for each remote provider record that it marks its text or allow it unmarked (Data Residency Map, Content marking). Help: Content marking."
      - "An answer an administrator allowed without a mark carries a notice, in the chat and in the x-faden-unmarked header; work the AI Act exempts (code, translation, correction) is declared per request by those allowed to."
      - "The PII module runs a local model, with the language you choose."
      - "LLM Calls: find the call that went wrong, with its route and timeline."
      - "The console chat says, under the message box, that its answers come from an AI."
      - "Receipts count answers of remote providers as unmarked, unless an administrator recorded evidence that the provider marks them."
      - "The provenance module's licence (still the draft) asks that the marks are kept, and Help gives a sentence for your own terms of use."
      - "Security updates: certifi 2026.10.19 (compromised emSign roots), Pillow 13.0.0, aiohttp 3.14.5, in the services and in the node agent 0.2.11; update the machines' agents after the server (Help: Upgrading)."
      - "Known gaps: a text can be checked only by people with an account on the installation that wrote it; the x86_64 runtime is certified on one machine, not on a cluster of several."
    fixes:
      - id: GHSA-6q48-6c7w-9gw2
        severity: critical
        summary: certifi before 2026.10.19 trusts emSign roots whose intermediate keys were compromised.
      - id: GHSA-8g5g-8vmr-9782
        severity: critical
        summary: Pillow before 13.0.0 (and further advisories fixed with it).
    upgrade_from: 0.4.0
    components:
      agent: 0.2.11
