# Every Fadenstack release, as the update check tells installs about it.
#
# release/update_feed.py turns this file into the signed feed at
# https://fadenstack.com/updates/v1/index.json, which every install reads once a day
# (docs/help/pages/operate/upgrading.md, "How you hear about a new release").
# Add a release's entry BEFORE tagging it: the release workflow refuses a tag without one.
#
# Per release:
#   version       the release (also the CLI's and the images' version)
#   channel       stable | preview (a pre-release such as 0.5.0rc1 must be preview)
#   date          YYYY-MM-DD; left empty, the build fills in the day it runs for the release it builds
#   severity      normal | security (fixes a security problem) | critical (upgrade now)
#                 Installs are told the most urgent severity of all releases newer than theirs.
#   summary       one line, English
#   highlights    optional: what is new, a line each, English (fadenstack.com/releases/ shows them)
#   notes_url     optional; default: the release on fadenstack.com/releases/
#   upgrade_from  optional: the oldest release that can upgrade straight to this one. `faden upgrade`
#                 refuses to skip it and names the release to install first.
#   fixes         optional: security problems fixed (id, severity, summary), once they may be public
#   components    versions released with it: agent (the backend's AGENT_VERSION)
#
# series: how long a minor series gets fixes. Past the day, its installs are told they are unsupported.
# Only state a day you mean to keep.

series: []

releases:
  - version: 0.5.0rc1
    channel: preview
    date: ""
    severity: normal
    summary: >-
      Release candidate of 0.5.0, a Preview release: content marking for the EU AI Act (Art. 50(2)), checking
      content, the local PII runtime, the LLM Calls page and the GB10 runtime with vLLM 0.31.
    highlights:
      - "A Preview release: `faden deploy` and `faden upgrade` say what that means and ask before they go on."
      - "Content marking, on by default: pictures carry signed C2PA content credentials, an invisible watermark and IPTC metadata; every text answer gets a signed receipt, and chat models on a runtime with vLLM 0.30 or later write a text watermark."
      - "Check content: everyone signed in can check a text, a picture or a file; the public check page for pictures and files is on by default."
      - "An edited copy of an answer is still found, by the fingerprint its receipt keeps."
      - "Chat models that watermark start without speculative decoding (MTP), with which the watermark did not hold."
      - "The GB10 runtime with vLLM 0.31.0, certified on the DGX Spark pair with its watermark, is the GB10 default."
      - "The PII module runs a local model, with the language you choose."
      - "LLM Calls: find the call that went wrong, with its route and timeline."
      - "Known gaps: answers of remote providers and of the x86_64 runtime (vLLM 0.26) carry no text watermark yet, and are not yet refused or flagged."
    upgrade_from: 0.4.0
    components:
      agent: 0.2.10
  - version: 0.4.5
    channel: stable
    date: ""
    severity: normal
    summary: >-
      A user's language follows them to every client, a switched-off module's containers stop, every service
      shows the release's version, and operators see admin-only engine settings as read-only.
    highlights:
      - "A language picked once, in the console or in an agent's settings, is the user's in every client and agent."
      - "`faden up` stops and removes the containers of a module you switched off; its data is kept."
      - "The Updates page shows the release's version for every service."
      - "Operators see code-running engine settings read-only, with a note, instead of a refusal when they save."
      - "A release's page on GitHub starts with what is new."
    upgrade_from: 0.4.0
    components:
      agent: 0.2.10
  - version: 0.4.5rc1
    channel: preview
    date: "2026-10-14"
    severity: normal
    summary: >-
      Release candidate: a user's language follows them to every client, a switched-off module's containers stop,
      every service shows the release's version, and operators see admin-only engine settings as read-only.
    highlights:
      - "A language picked once, in the console or in an agent's settings, is the user's in every client and agent."
      - "`faden up` stops and removes the containers of a module you switched off; its data is kept."
      - "The Updates page shows the release's version for every service."
      - "Operators see code-running engine settings read-only, with a note, instead of a refusal when they save."
      - "A release's page on GitHub starts with what is new."
    upgrade_from: 0.4.0
    components:
      agent: 0.2.10
  - version: 0.4.4
    channel: stable
    date: "2026-10-13"
    severity: security
    summary: >-
      Security and reliability: provider keys are encrypted, sign-ins end on logout, MCP's personal-data check
      fails closed, company files are copied and verified across upgrades, and new clusters encrypt their Ray traffic.
    highlights:
      - "Remote providers' API keys are stored encrypted, and `faden secrets rotate` changes the keys that seal stored data."
      - "Signing out ends that sign-in, and a password change ends all of them."
      - "An MCP tool call is refused when its personal-data check cannot run."
      - "Operators can no longer switch on remote code or other code-running engine settings, and an agent's tool limit holds when a tool runs."
      - "Chat attachments and, with a data folder, the knowledge base's files are copied and verified on upgrade; a conflict stops the upgrade instead of overwriting."
      - "New clusters encrypt their Ray traffic (Ray TLS) from the start."
      - "After an upgrade that changes a runtime's mounts, a cluster keeps serving and offers the new settings as Apply and restart."
      - "New machines install only the agent build this release pins, checked by its SHA-256."
      - "Docker's logs rotate, Redis has a memory cap, and backups and restores need no image from the internet."
      - "The DGX Spark runtime is built on vLLM's own image and mounts the machine's own model store and Hugging Face cache; the console runs on Node.js 24 LTS."
    upgrade_from: 0.4.0
    components:
      agent: 0.2.10
  - version: 0.4.4rc2
    channel: preview
    date: "2026-10-12"
    severity: security
    summary: >-
      Release candidate 2: on a DGX Spark the runtime mounts the machine's own model store again, and a cluster
      still on a withdrawn runtime is shown on it and can be switched off it.
    highlights:
      - "DGX Spark runtimes mount the machine's own model store and Hugging Face cache instead of fixed paths."
      - "A cluster still running a runtime this release no longer ships says so, and switching restarts it on the certified one."
    upgrade_from: 0.4.0
    components:
      agent: 0.2.9
  - version: 0.4.4rc1
    channel: preview
    date: "2026-10-12"
    severity: security
    summary: >-
      Security and reliability: provider keys are encrypted, sign-ins end on logout, MCP's personal-data check
      fails closed, chat attachments are kept on a volume, and the keys that seal stored data can be rotated.
    highlights:
      - "Chat attachments are kept on a volume (or a directory of your choice), copied over and verified on upgrade, and part of the backup."
      - "Remote providers' API keys are stored encrypted, and `faden secrets rotate` changes the keys that seal stored data."
      - "Signing out ends that sign-in, and a password change ends all of them."
      - "An MCP tool call is refused when its personal-data check cannot run."
      - "Operators can no longer switch on remote code or other code-running engine settings, and an agent's tool limit holds when a tool runs."
      - "New machines install only the agent build this release pins, checked by its SHA-256."
      - "Docker's logs rotate, Redis has a memory cap, and backups keep each kind apart and check their volume archives."
      - "The DGX Spark runtime is built on vLLM's own image, and the console runs on Node.js 24 LTS."
    upgrade_from: 0.4.0
    components:
      agent: 0.2.9
  - version: 0.4.3
    channel: stable
    date: "2026-10-11"
    severity: normal
    summary: >-
      The machines' runtime images come with the release, a model a machine already holds is used where it is,
      and hybrid models such as Qwen3.8 start with the settings the console suggests.
    highlights:
      - "Runtime images for NVIDIA DGX Spark and x86 machines are published with the release: a new install can run models."
      - "A model in a machine's Hugging Face cache is used in place, also when other tools share that cache."
      - "Hybrid models (linear attention or Mamba, such as Qwen3.8) are planned with the memory each conversation needs, and start."
      - "A cluster taken over after a reinstall keeps its encrypted model traffic, and its models answer."
    upgrade_from: 0.4.0
    components:
      agent: 0.2.8
  - version: 0.4.2
    channel: stable
    date: "2026-10-11"
    severity: security
    summary: >-
      Security fixes: API tokens expire and can be revoked, the setup token lasts an hour, devices are
      checked again, and knowledge collections are read only by the people they are open to.
    highlights:
      - "Security: sign-in limits, no fixed logins or published secrets, and expired or revoked API tokens refused everywhere."
      - "Access checks on people search, chat attachments and knowledge collections."
      - "Ask first rules also hold for an agent's own tools."
      - "Personal data: tool arguments that cannot be redacted are not sent, and a chat can only make detection stricter."
      - "Pictures in the chat, sent only to models that take them."
      - "The console says when a new release is out, with the commands to upgrade."
    upgrade_from: 0.4.0
    components:
      agent: 0.2.7
