# Reusable workflow: build and push a single Fadenstack Docker image.
# Called by per-service workflows or the orchestrator workflow.
#
# Inputs:
#   service   — image name (api, backend, frontend, pii, mcp, skills)
#   context   — relative path to the build context (e.g. faden_backend)
#   registry  — GHCR registry path (default: ghcr.io/fadenstack)
#   platforms — comma-separated platforms (default: linux/amd64)
#   build-contexts — named build contexts, name=path per line (optional)
#   target    — the Dockerfile stage to publish (optional; default: the last one).
#               The services' Dockerfiles end with `FROM prod AS dev`, so they
#               pass `prod`: without it the dev stage, with the dev tools, was
#               what installs pulled.
#   base-image — the platform base image to build FROM (optional): the base just
#               built from this commit, rather than the Dockerfile's default
#               base:latest, which moves on releases only.
#
# Tags: the branch (`main`), the commit (short and full SHA), and for a release
# tag v<version> (or core-v<version>) the version, its minor, and `latest`.
# `latest` moves on releases only: a push to main used to move it, so whatever
# was merged last became what an unpinned install pulled.

name: Build Docker Image

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      context:
        required: true
        type: string
      registry:
        required: false
        type: string
        default: ghcr.io/fadenstack
      platforms:
        required: false
        type: string
        default: linux/amd64
      build-contexts:
        required: false
        type: string
        default: ""
      target:
        required: false
        type: string
        default: ""
      base-image:
        required: false
        type: string
        default: ""

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `latest` and the X.Y tag follow final releases only: a release candidate (v0.5.0rc1)
      # is pulled by its exact version, by whoever chose the preview channel.
      - name: Final release or not
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/(core-)?v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "final=true" >> "$GITHUB_OUTPUT"
          else
            echo "final=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ inputs.service }}
          # With the default (auto), every type=match tag would also move `latest`, a
          # release candidate's too; the raw tag below decides instead.
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=match,pattern=^v(\d+\.\d+\.\d+.*)$,group=1
            type=match,pattern=^v(\d+\.\d+)\.\d+$,group=1
            type=match,pattern=^core-v(\d+\.\d+\.\d+.*)$,group=1
            type=match,pattern=^core-v(\d+\.\d+)\.\d+$,group=1
            type=sha,prefix=
            type=sha,prefix=,format=long
            type=raw,value=latest,enable=${{ steps.release.outputs.final == 'true' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/Dockerfile
          target: ${{ inputs.target }}
          build-args: ${{ inputs.base-image != '' && format('BASE_IMAGE={0}', inputs.base-image) || '' }}
          build-contexts: ${{ inputs.build-contexts }}
          platforms: ${{ inputs.platforms }}
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
