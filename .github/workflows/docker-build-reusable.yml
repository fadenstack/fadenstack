# Reusable workflow: build and push a single Fadenstack Docker image.
# Called by per-service workflows or the orchestrator workflow.
#
# Inputs:
#   service   — image name (api, backend, frontend, pii, mcp, skills)
#   context   — relative path to the build context (e.g. faden_backend)
#   registry  — GHCR registry path (default: ghcr.io/fadenstack)
#   platforms — comma-separated platforms (default: linux/amd64)
#   build-contexts — named build contexts, name=path per line (optional)
#   target    — the Dockerfile stage to publish (optional; default: the last one).
#               The services' Dockerfiles end with `FROM prod AS dev`, so they
#               pass `prod`: without it the dev stage, with the dev tools, was
#               what installs pulled.
#   base-image — the platform base image to build FROM (optional): the base just
#               built from this commit, rather than the Dockerfile's default
#               base:latest, which moves on releases only.
#   title, description — this image's own name and what it is (plain text, at
#               most 512 characters, no "#": metadata-action reads "#" as a
#               comment). GHCR shows the description on the package's page.
#   licenses  — SPDX expression (default Apache-2.0, the repository's licence).
#
# Labels and annotations: metadata-action fills the OCI keys from the repository
# (its description and the title "fadenstack" for every image); the title,
# description and licenses here replace them, both as the image's labels and as
# annotations on the image manifest and on the image index. With `sbom: true` the
# push is an OCI index (the image and its attestation), and GHCR reads a
# multi-platform image's description from the index's annotations, not from a
# label. The same three keys are LABELs in each Dockerfile's published stage, for
# images built outside this workflow (cli/tests/test_image_labels.py keeps them
# equal to docker-publish.yml).
#
# Tags: the branch (`main`), the commit (short and full SHA), and for a release
# tag v<version> (or core-v<version>) the version, its minor, and `latest`.
# `latest` moves on releases only: a push to main used to move it, so whatever
# was merged last became what an unpinned install pulled.

name: Build Docker Image

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      context:
        required: true
        type: string
      registry:
        required: false
        type: string
        default: ghcr.io/fadenstack
      platforms:
        required: false
        type: string
        default: linux/amd64
      build-contexts:
        required: false
        type: string
        default: ""
      target:
        required: false
        type: string
        default: ""
      base-image:
        required: false
        type: string
        default: ""
      tag-suffix:
        required: false
        type: string
        default: ""
      title:
        required: true
        type: string
      description:
        required: true
        type: string
      licenses:
        required: false
        type: string
        default: Apache-2.0

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `latest` and the X.Y tag follow final releases only: a release candidate (v0.5.0rc1)
      # is pulled by its exact version, by whoever chose the preview channel.
      - name: Final release or not
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/(core-)?v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "final=true" >> "$GITHUB_OUTPUT"
          else
            echo "final=false" >> "$GITHUB_OUTPUT"
          fi

      # GHCR takes at most 512 characters of plain text; a newline would split the
      # key=value lists below, and metadata-action drops what follows a "#".
      - name: The image's description fits
        shell: bash
        env:
          TITLE: ${{ inputs.title }}
          DESCRIPTION: ${{ inputs.description }}
        run: |
          if [ -z "$TITLE" ] || [ -z "$DESCRIPTION" ]; then
            echo "::error::Every image needs its own title and description"; exit 1
          fi
          if [ "${#DESCRIPTION}" -gt 512 ]; then
            echo "::error::The description has ${#DESCRIPTION} characters; GHCR takes 512"; exit 1
          fi
          case "$TITLE$DESCRIPTION" in
            *$'\n'*|*'#'*) echo "::error::No newline or # in the title or description"; exit 1 ;;
          esac

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # The annotations output for the image manifest and for the index (default: manifest only).
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ inputs.registry }}/${{ inputs.service }}
          labels: |
            org.opencontainers.image.title=${{ inputs.title }}
            org.opencontainers.image.description=${{ inputs.description }}
            org.opencontainers.image.licenses=${{ inputs.licenses }}
          annotations: |
            org.opencontainers.image.title=${{ inputs.title }}
            org.opencontainers.image.description=${{ inputs.description }}
            org.opencontainers.image.licenses=${{ inputs.licenses }}
          # With the default (auto), every type=match tag would also move `latest`, a
          # release candidate's too; the raw tag below decides instead.
          flavor: |
            latest=false
            suffix=${{ inputs.tag-suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=match,pattern=^v(\d+\.\d+\.\d+.*)$,group=1
            type=match,pattern=^v(\d+\.\d+)\.\d+$,group=1
            type=match,pattern=^core-v(\d+\.\d+\.\d+.*)$,group=1
            type=match,pattern=^core-v(\d+\.\d+)\.\d+$,group=1
            type=sha,prefix=
            type=sha,prefix=,format=long
            type=raw,value=latest,enable=${{ steps.release.outputs.final == 'true' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/Dockerfile
          target: ${{ inputs.target }}
          build-args: ${{ inputs.base-image != '' && format('BASE_IMAGE={0}', inputs.base-image) || '' }}
          build-contexts: ${{ inputs.build-contexts }}
          platforms: ${{ inputs.platforms }}
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
