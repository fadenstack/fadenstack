# Publish fadenstack to PyPI, with standalone executables, for a release.
#
# The CLI *is* the release a user installs: it carries the deployment files
# (shared, packed by cli/hatch_build.py) and `faden deploy`
# runs the images tagged with its own version. So:
#
#   1. Set the version in cli/pyproject.toml and
#      cli/src/faden_cli/__init__.py (e.g. 0.3.0), and add the release to
#      release/releases.yaml (severity, summary): installs hear about it from there.
#   2. Tag and push:  git tag v0.3.0 && git push origin v0.3.0
#      docker-publish.yml builds the images 0.3.0 from the same tag; this
#      workflow waits until they exist before publishing the CLI, so nobody
#      can install a CLI whose images are missing.
#
# (cli-v* tags still publish the CLI alone, for a CLI-only fix; the images of
# the version it pins must already exist.)
#
# PyPI publishing is trusted publishing: PyPI trusts this workflow file in the
# `pypi` environment of fadenstack/fadenstack, so no token is stored anywhere.
#
# Needed: UPDATE_FEED_SIGNING_KEY signs the release feed (job feed). Optional:
# FEED_DEPLOY_SSH_KEY, FEED_DEPLOY_HOST, FEED_DEPLOY_KNOWN_HOSTS put it on fadenstack.com.

name: Release CLI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "cli-v*"

permissions:
  contents: write
  packages: read

env:
  CLI_DIR: cli
  REGISTRY: ghcr.io/fadenstack

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The deployment files the wheel carries come from shared; the release
          # feed's entry from release/, checked against the backend's agent version.
          sparse-checkout: |
            cli
            shared
            release
            backend/faden_backend/web/api/install

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: The tag and the package agree on the version
        id: version
        shell: bash
        working-directory: ${{ env.CLI_DIR }}
        run: |
          set -euo pipefail
          PYPROJECT=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          PACKAGE=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/faden_cli/__init__.py)
          if [ "$PYPROJECT" != "$PACKAGE" ]; then
            echo "::error::pyproject says $PYPROJECT, src/faden_cli/__init__.py says $PACKAGE"
            exit 1
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          case "$GITHUB_REF" in
            refs/tags/v*|refs/tags/cli-v*)
              if [ "${TAG#cli-}" != "v$PYPROJECT" ]; then
                echo "::error::Tag $TAG does not match version $PYPROJECT"
                exit 1
              fi ;;
          esac
          echo "version=$PYPROJECT" >> "$GITHUB_OUTPUT"
          # 0.5.0rc1, 0.5.0b2, ...: a pre-release, for the preview channel only.
          if [[ "$PYPROJECT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      # Installs hear about a release from the feed built out of release/releases.yaml
      # (job feed). Checked before anything is published: a release without its entry
      # would reach no install.
      - name: The release is in release/releases.yaml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          pip install pyyaml cryptography packaging
          python release/update_feed.py build --version "${{ steps.version.outputs.version }}" --out "$RUNNER_TEMP/feed"

      - name: Build sdist + wheel
        working-directory: ${{ env.CLI_DIR }}
        run: |
          pip install --upgrade build
          python -m build

      - name: The wheel carries the deployment files
        working-directory: ${{ env.CLI_DIR }}
        run: |
          set -euo pipefail
          python -m zipfile -l dist/*.whl > contents.txt
          for f in docker-compose.yaml nginx/nginx.conf initdb/01-init.sql prometheus/prometheus.yml; do
            grep -q "faden_cli/bundle/shared/$f" contents.txt || { echo "::error::wheel lacks $f"; exit 1; }
          done
          if grep -qE "bundle/shared/(\.env|\.bootstrap-credentials|backups/)" contents.txt; then
            echo "::error::wheel carries install state"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: ${{ env.CLI_DIR }}/dist/*

  images-exist:
    # `faden deploy` pulls <registry>/<service>:<version>. Publishing a CLI
    # before its images exist hands users a deploy that cannot pull.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Wait for this release's images
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for attempt in $(seq 1 60); do
            missing=""
            for svc in base gateway backend frontend pii mcp skills; do
              docker manifest inspect "$REGISTRY/$svc:$VERSION" >/dev/null 2>&1 || missing="$missing $svc"
            done
            [ -z "$missing" ] && { echo "All images for $VERSION are published."; exit 0; }
            echo "Waiting for:$missing ($attempt/60)"
            sleep 60
          done
          echo "::error::Images for $VERSION never appeared:$missing"
          exit 1

  publish:
    # A manual run stops before this: it checks the build, publishes nothing.
    needs: [build, images-exist]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI accepts this job's OIDC token for this workflow
    # in this environment, which only release tags may use.
    environment: pypi
    permissions:
      contents: write  # the GitHub release
      id-token: write  # PyPI's trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Fadenstack ${{ needs.build.outputs.version }}"
          # A release candidate is a pre-release: /releases/latest and stable installs skip it.
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            Fadenstack-authored source and deployment files in this release are
            licensed under Apache-2.0. Third-party packages and images retain
            their own terms; see LICENSE, NOTICE, and docs/help/pages/operate/third-party.md.

            The wheel and standalone binaries are attached to this release; the
            same version is on PyPI.

            ```bash
            pipx install fadenstack==${{ needs.build.outputs.version }}
            faden deploy
            ```
            Runs the images `${{ env.REGISTRY }}/*:${{ needs.build.outputs.version }}`.
            Upgrading an install: install this CLI, then `faden upgrade`.
          files: dist/*

  executables:
    needs: [build, publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: faden-linux-amd64
            artifact: faden-linux-amd64
          - os: windows-latest
            name: faden-windows-amd64
            artifact: faden-windows-amd64.exe
          - os: macos-latest
            name: faden-macos-arm64
            artifact: faden-macos-arm64
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build executable
        shell: bash
        run: |
          pip install --upgrade pip pyinstaller
          pip install dist/*.whl
          ENTRY=$(python -c "import faden_cli.cli, sys; print(faden_cli.cli.__file__)")
          # --collect-data: the deployment files are package data.
          pyinstaller --onefile --clean --name "${{ matrix.name }}" \
            --collect-submodules faden_cli --collect-data faden_cli "$ENTRY"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/${{ matrix.artifact }}

  checksums:
    # One SHA256SUMS for the wheel, the sdist and the executables, so a download can be checked.
    needs: [build, executables]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir assets && cd assets
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --pattern 'fadenstack-*' --pattern 'faden-*'
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${{ github.ref_name }}" SHA256SUMS --repo "${{ github.repository }}" --clobber

  feed:
    # The release feed installs read once a day (release/update_feed.py): built from
    # release/releases.yaml, signed with UPDATE_FEED_SIGNING_KEY (the key the CLI and
    # backend trust), attached to the release, and put on fadenstack.com/updates/v1/.
    needs: [build, publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      UPDATE_FEED_SIGNING_KEY: ${{ secrets.UPDATE_FEED_SIGNING_KEY }}
      FEED_DEPLOY_SSH_KEY: ${{ secrets.FEED_DEPLOY_SSH_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            release
            cli/src/faden_cli/core
            backend/faden_backend/web/api/install

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build, sign and check the feed
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_FEED_SIGNING_KEY" ]; then
            echo "::error::UPDATE_FEED_SIGNING_KEY is not set: no install will hear about this release"
            exit 1
          fi
          pip install pyyaml cryptography packaging
          python release/update_feed.py build --version "${{ needs.build.outputs.version }}" --out feed
          python release/update_feed.py sign feed
          python release/update_feed.py verify feed

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            feed/index.json
            feed/index.json.sig

      # The key can only write the feed's folder on the server (rrsync; fadenstack.com
      # repository, deploy/SETUP.md, "The release feed"). Without it, publish by hand
      # with deploy/publish-feed.sh there.
      - name: Put it on fadenstack.com
        if: env.FEED_DEPLOY_SSH_KEY != ''
        shell: bash
        env:
          FEED_DEPLOY_HOST: ${{ secrets.FEED_DEPLOY_HOST }}
          FEED_DEPLOY_KNOWN_HOSTS: ${{ secrets.FEED_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$FEED_DEPLOY_SSH_KEY" > ~/.ssh/feed && chmod 600 ~/.ssh/feed
          printf '%s\n' "$FEED_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # --delay-updates: both files change together, so no install reads a feed with the old signature.
          rsync -e "ssh -i $HOME/.ssh/feed -o BatchMode=yes" --delay-updates --chmod=F644 \
            feed/index.json feed/index.json.sig "$FEED_DEPLOY_HOST:v1/"
          curl -fsS https://fadenstack.com/updates/v1/index.json | grep -q "\"${{ needs.build.outputs.version }}\""

  sbom:
    needs: [build, executables]
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/sbom-release.yml
    with:
      kind: cli
      version: ${{ needs.build.outputs.version }}
      release_tag: ${{ github.ref_name }}
