# Build and push all Fadenstack core Docker images to GHCR.
#
# Trigger options:
#   - Push to main (builds changed services only), tagged main and the commit
#     SHA. It does not move latest.
#   - A release tag v<version> (e.g. v0.3.0): every image, tagged 0.3.0, 0.3 and
#     latest. `faden deploy` from the CLI of that version pulls exactly
#     <version>, so the images must be published before the CLI is.
#
# The services are published from their Dockerfile's `prod` stage, built FROM the
# base image of the same commit (base:<sha>, built first).
#   - Manual dispatch (choose which services to build)
#
# Prerequisites:
#   1. Ensure the repo has packages:write permission (automatic with GITHUB_TOKEN)
#   2. Images are published to ghcr.io/fadenstack/<service>

name: Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Services to build (comma-separated or 'all')"
        required: false
        default: "all"
        type: string
      registry:
        description: "Container registry"
        required: false
        default: "ghcr.io/fadenstack"
        type: string
      version:
        description: "Image tag (leave empty for auto-tagging)"
        required: false
        default: ""
        type: string

  push:
    branches: [main]
    tags:
      - "v*"
      - "core-v*"

permissions:
  contents: read

env:
  REGISTRY: ${{ github.event.inputs.registry || 'ghcr.io/fadenstack' }}

jobs:
  # ── Determine which services to build ───────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      pii: ${{ steps.filter.outputs.pii }}
      mcp: ${{ steps.filter.outputs.mcp }}
      skills: ${{ steps.filter.outputs.skills }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check notices required by vendored API docs
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/core-v')
        shell: bash
        run: |
          set -euo pipefail
          for service in backend gateway pii; do
            case "$service" in
              backend) package=faden_backend ;;
              gateway) package=faden_gateway ;;
              pii) package=faden_pii ;;
            esac
            docs="$service/$package/static/docs"
            for asset in swagger-ui-bundle.js redoc.standalone.js; do
              test -s "$docs/$asset.LICENSE.txt" || {
                echo "::error::Missing license notices for $docs/$asset"
                exit 1
              }
            done
          done
      - name: Check if building all
        id: manual
        run: |
          SERVICES="${{ github.event.inputs.services }}"
          # Build all on release tags or a manual run with all services selected.
          if [[ "$GITHUB_REF" == refs/tags/core-v* || "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "build_all=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == workflow_dispatch && ( "$SERVICES" == "all" || -z "$SERVICES" ) ]]; then
            echo "build_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_all=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: steps.manual.outputs.build_all != 'true' && github.event_name == 'push'
        with:
          filters: |
            gateway:      ['gateway/**']
            backend:  ['backend/**', 'runtime-image/runtime-manifest*.json']
            frontend: ['frontend/**', 'docs/help/**', 'docs/theme/**']
            pii:      ['pii/**']
            mcp:      ['mcp/**']
            skills:   ['skills/**']

  # ── Build base image first ────────────────────────────────────────
  base:
    needs: changes
    permissions:
      contents: read
      packages: write  # the reusable workflow pushes to GHCR
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      service: base
      context: shared/base
      registry: ${{ github.event.inputs.registry || 'ghcr.io/fadenstack' }}

  # ── Build each service ──────────────────────────────────────────────
  gateway:
    needs: [changes, base]
    if: >-
      needs.changes.outputs.gateway == 'true' ||
      startsWith(github.ref, 'refs/tags/core-v') ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'gateway'))
    permissions:
      contents: read
      packages: write  # the reusable workflow pushes to GHCR
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      service: gateway
      context: gateway
      # The production stage; the Dockerfile ends with the dev one.
      target: prod
      base-image: ${{ github.event.inputs.registry || 'ghcr.io/fadenstack' }}/base:${{ github.sha }}
      registry: ${{ github.event.inputs.registry || 'ghcr.io/fadenstack' }}

  backend:
    needs: [changes, base]
    if: >-
      needs.changes.outputs.backend == 'true' ||
      startsWith(github.ref, 'refs/tags/core-v') ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'backend'))
    permissions:
      contents: read
      packages: write  # the reusable workflow pushes to GHCR
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      service: backend
      context: backend
      # The production stage; the Dockerfile ends with the dev one.
      target: prod
      base-image: ${{ github.event.inputs.registry || 'ghcr.io/fadenstack' }}/base:${{ github.sha }}
      # The runtime manifests the Dockerfile copies in.
      build-contexts: runtime_manifests=runtime-image
      registry: ${{ github.event.inputs.registry || 'ghcr.io/fadenstack' }}

  frontend:
    needs: changes
    if: >-
      needs.changes.outputs.frontend == 'true' ||
      startsWith(github.ref, 'refs/tags/core-v') ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'frontend'))
    permissions:
      contents: read
      packages: write  # the reusable workflow pushes to GHCR
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      service: frontend
      context: frontend
      # Help, built into the image and served at /help.
      build-contexts: docs=docs
      registry: ${{ github.event.inputs.registry || 'ghcr.io/fadenstack' }}

  pii:
    needs: [changes, base]
    if: >-
      needs.changes.outputs.pii == 'true' ||
      startsWith(github.ref, 'refs/tags/core-v') ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'pii'))
    permissions:
      contents: read
      packages: write  # the reusable workflow pushes to GHCR
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      service: pii
      context: pii
      # The production stage; the Dockerfile ends with the dev one.
      target: prod
      base-image: ${{ github.event.inputs.registry || 'ghcr.io/fadenstack' }}/base:${{ github.sha }}
      registry: ${{ github.event.inputs.registry || 'ghcr.io/fadenstack' }}

  pii-neural:
    needs: [changes, base]
    if: >-
      needs.changes.outputs.pii == 'true' ||
      startsWith(github.ref, 'refs/tags/core-v') ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'pii'))
    strategy:
      matrix:
        variant: [cpu, gpu]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      service: pii
      context: pii
      target: prod-${{ matrix.variant }}
      tag-suffix: -${{ matrix.variant }}
      base-image: ${{ github.event.inputs.registry || 'ghcr.io/fadenstack' }}/base:${{ github.sha }}
      registry: ${{ github.event.inputs.registry || 'ghcr.io/fadenstack' }}

  mcp:
    needs: [changes, base]
    if: >-
      needs.changes.outputs.mcp == 'true' ||
      startsWith(github.ref, 'refs/tags/core-v') ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'mcp'))
    permissions:
      contents: read
      packages: write  # the reusable workflow pushes to GHCR
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      service: mcp
      context: mcp
      # The production stage; the Dockerfile ends with the dev one.
      target: prod
      base-image: ${{ github.event.inputs.registry || 'ghcr.io/fadenstack' }}/base:${{ github.sha }}
      registry: ${{ github.event.inputs.registry || 'ghcr.io/fadenstack' }}

  skills:
    needs: [changes, base]
    if: >-
      needs.changes.outputs.skills == 'true' ||
      startsWith(github.ref, 'refs/tags/core-v') ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'skills'))
    permissions:
      contents: read
      packages: write  # the reusable workflow pushes to GHCR
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      service: skills
      context: skills
      # The production stage; the Dockerfile ends with the dev one.
      target: prod
      base-image: ${{ github.event.inputs.registry || 'ghcr.io/fadenstack' }}/base:${{ github.sha }}
      registry: ${{ github.event.inputs.registry || 'ghcr.io/fadenstack' }}
