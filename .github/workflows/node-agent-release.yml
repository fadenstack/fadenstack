# Build and release the node agent: the binaries the install line fetches.
#
# The backend's install plan points machines at
#   https://github.com/fadenstack/fadenstack/releases/download/node-agent-v<version>/faden-agent-<platform>
# for <platform> linux-x86_64, linux-aarch64 and macos-arm64 (see
# backend/faden_backend/web/api/install/__init__.py, RELEASE_URL and AGENT_VERSION).
# This workflow makes exactly those files.
#
# Release:
#   1. Bump the version in agent/pyproject.toml and
#      agent/faden_agent/__init__.py, and AGENT_VERSION in
#      the backend -- the backend is what tells machines which agent to install.
#   2. Tag and push: git tag node-agent-v0.1.12 && git push origin node-agent-v0.1.12
#
# Each binary is built by build-binary.sh in a Debian bookworm container, on a
# runner of its own architecture: built on a newer distro, the agent links a
# newer glibc and fails on older nodes (the DGX Sparks run glibc 2.39; many
# servers run older).
#
# The Mac build runs natively on macos-26 (Apple Silicon), the oldest macOS
# the agent supports (MIN_MACOS_MAJOR in the backend), unpacked (no UPX).
# Its signature (build-binary.sh, FADEN_MAC_SIGNING):
#   - developer-id when the Apple secrets are set: Developer ID with the
#     hardened runtime, plus a notarized, stapled faden-agent-macos-arm64.pkg
#     (macos-package.sh). The release pins both.
#   - adhoc, only when chosen: on a tag, with no Apple secrets, the job fails
#     unless the repository variable FADEN_MAC_SIGNING is "adhoc". The curl
#     install runs it as it is (curl sets no quarantine flag); the release
#     pins the binary only and says "ad-hoc signed (not notarized)".
#   A partial or misnamed set of Apple secrets always fails the job.
# The secrets are environment secrets of apple-signing (repository settings:
# deployment policy node-agent-v* tags). workflow_dispatch can force a mode,
# hardened-adhoc included, to try the release entitlements without an Apple
# account; hardened-adhoc is never released.

name: Release Node Agent

on:
  workflow_dispatch:
    inputs:
      mac_signing:
        description: "Mac signing: auto (developer-id when the Apple secrets exist, else adhoc), adhoc, hardened-adhoc, developer-id"
        type: choice
        options: [auto, adhoc, hardened-adhoc, developer-id]
        default: auto
  push:
    tags:
      - "node-agent-v*"

permissions:
  contents: read

env:
  AGENT_DIR: agent

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The tag, the agent and the backend agree on the version
        id: check
        shell: bash
        run: |
          set -euo pipefail
          PYPROJECT=$(python3 -c "import tomllib; print(tomllib.load(open('$AGENT_DIR/pyproject.toml','rb'))['project']['version'])")
          PACKAGE=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' "$AGENT_DIR/faden_agent/__init__.py")
          BACKEND=$(sed -n 's/^AGENT_VERSION = "\(.*\)"/\1/p' backend/faden_backend/web/api/install/__init__.py)
          echo "pyproject=$PYPROJECT package=$PACKAGE backend=$BACKEND"
          if [ "$PYPROJECT" != "$PACKAGE" ] || [ "$PYPROJECT" != "$BACKEND" ]; then
            echo "::error::Versions differ: pyproject $PYPROJECT, package $PACKAGE, backend AGENT_VERSION $BACKEND"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/node-agent-v* ]] && [ "${GITHUB_REF#refs/tags/node-agent-v}" != "$PYPROJECT" ]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match version $PYPROJECT"
            exit 1
          fi
          echo "version=$PYPROJECT" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: agent

      - name: Build
        working-directory: ${{ env.AGENT_DIR }}
        run: sh build-binary.sh ${{ matrix.platform }}

      - name: Smoke test
        working-directory: ${{ env.AGENT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/faden-agent-${{ matrix.platform }}"
          chmod +x "$BIN"
          # It must start, parse its arguments and print its licence -- in the
          # oldest environment it claims to support, not only on this runner.
          docker run --rm -v "$PWD/dist:/d:ro" debian:bookworm-slim "/d/faden-agent-${{ matrix.platform }}" license > "$RUNNER_TEMP/agent-license.txt"
          sed -n '1,5p' "$RUNNER_TEMP/agent-license.txt"
          grep -q 'Apache License' "$RUNNER_TEMP/agent-license.txt"
          grep -q 'license --third-party' "$RUNNER_TEMP/agent-license.txt"
          # And the licences of what it bundles: the packages (certifi is
          # MPL-2.0), Python, the Debian libraries, PyInstaller's bootloader.
          docker run --rm -v "$PWD/dist:/d:ro" debian:bookworm-slim "/d/faden-agent-${{ matrix.platform }}" license --third-party > "$RUNNER_TEMP/agent-third-party.txt"
          for text in 'Mozilla Public License' 'The interpreter and its standard library' 'libssl3' 'Bootloader Exception'; do
            grep -q "$text" "$RUNNER_TEMP/agent-third-party.txt" || { echo "::error::Third-party notices lack: $text"; exit 1; }
          done
          test -s "$BIN.THIRD-PARTY-NOTICES.txt"
          sha256sum "$BIN" | awk '{print $1}' > "$BIN.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: faden-agent-${{ matrix.platform }}
          path: |
            ${{ env.AGENT_DIR }}/dist/faden-agent-${{ matrix.platform }}
            ${{ env.AGENT_DIR }}/dist/faden-agent-${{ matrix.platform }}.sha256
            ${{ env.AGENT_DIR }}/dist/faden-agent-${{ matrix.platform }}.THIRD-PARTY-NOTICES.txt
          retention-days: 30

  build-macos:
    # The Mac build: its own job, for the environment that holds the Apple
    # secrets. apple-signing's deployment policy (repository settings) admits
    # node-agent-v* tags; a dispatch from elsewhere waits for that policy.
    needs: version
    runs-on: macos-26
    environment: apple-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # release/licenses: the texts for what a Mac libpython links in.
          sparse-checkout: |
            agent
            release/licenses

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Mac signing mode
        id: mac
        shell: bash
        env:
          REQUESTED: ${{ inputs.mac_signing || 'auto' }}
          # The explicit opt-in to an ad-hoc release when no Apple secrets exist.
          ADHOC_OPT_IN: ${{ vars.FADEN_MAC_SIGNING }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/node-agent-v') }}
          FADEN_MAC_CODESIGN_IDENTITY: ${{ secrets.FADEN_MAC_CODESIGN_IDENTITY }}
          FADEN_MAC_INSTALLER_IDENTITY: ${{ secrets.FADEN_MAC_INSTALLER_IDENTITY }}
          APPLE_CERTIFICATES_P12_BASE64: ${{ secrets.APPLE_CERTIFICATES_P12_BASE64 }}
          APPLE_CERTIFICATES_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_P12_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        working-directory: ${{ env.AGENT_DIR }}
        run: |
          set -euo pipefail
          rc=0; sh macos-package.sh secrets || rc=$?
          case "$rc" in
            0) complete=1 ;;
            1) complete=0 ;;
            *) echo "::error::The Apple signing secrets are incomplete or misnamed (above). Fix them; a release is never built ad hoc by accident."
               exit 1 ;;
          esac
          mode="$REQUESTED"
          if [ "$mode" = auto ]; then
            if [ "$complete" = 1 ]; then
              mode=developer-id
            elif [ "$IS_TAG" = true ] && [ "$ADHOC_OPT_IN" != adhoc ]; then
              echo "::error::No Apple signing secrets. To release the Mac build ad hoc (not notarized), set the repository variable FADEN_MAC_SIGNING=adhoc."
              exit 1
            else
              mode=adhoc
            fi
          fi
          if [ "$mode" = developer-id ] && [ "$complete" = 0 ]; then
            echo "::error::developer-id was asked for, but no Apple signing secrets are set."
            exit 1
          fi
          if [ "$mode" = hardened-adhoc ] && [ "$IS_TAG" = true ]; then
            echo "::error::hardened-adhoc is a test build; it is never released."
            exit 1
          fi
          case "$mode" in
            developer-id) line="Mac build: signed with a Developer ID and notarized (faden-agent-macos-arm64.pkg)." ;;
            *) line="Mac build: ad-hoc signed (not notarized)." ;;
          esac
          [ "$mode" = developer-id ] || echo "::warning::$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "line=$line" >> "$GITHUB_OUTPUT"

      - name: Signing keychain
        if: steps.mac.outputs.mode == 'developer-id'
        working-directory: ${{ env.AGENT_DIR }}
        env:
          FADEN_MAC_CODESIGN_IDENTITY: ${{ secrets.FADEN_MAC_CODESIGN_IDENTITY }}
          FADEN_MAC_INSTALLER_IDENTITY: ${{ secrets.FADEN_MAC_INSTALLER_IDENTITY }}
          APPLE_CERTIFICATES_P12_BASE64: ${{ secrets.APPLE_CERTIFICATES_P12_BASE64 }}
          APPLE_CERTIFICATES_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_P12_PASSWORD }}
        run: sh macos-package.sh keychain

      - name: Build
        working-directory: ${{ env.AGENT_DIR }}
        env:
          FADEN_MAC_SIGNING: ${{ steps.mac.outputs.mode }}
          FADEN_MAC_CODESIGN_IDENTITY: ${{ steps.mac.outputs.mode == 'developer-id' && secrets.FADEN_MAC_CODESIGN_IDENTITY || '' }}
        run: sh build-binary.sh macos-arm64

      - name: Smoke test
        working-directory: ${{ env.AGENT_DIR }}
        shell: bash
        env:
          SIGNING_LINE: ${{ steps.mac.outputs.line }}
        run: |
          set -euo pipefail
          BIN="dist/faden-agent-macos-arm64"
          file "$BIN" | grep -q 'Mach-O 64-bit executable arm64'
          codesign --verify --strict --verbose=2 "$BIN"
          # Starting it unpacks and loads every bundled library, under the
          # signature it ships with.
          "$BIN" license > "$RUNNER_TEMP/agent-license.txt"
          grep -q 'Apache License' "$RUNNER_TEMP/agent-license.txt"
          "$BIN" license --third-party > "$RUNNER_TEMP/agent-third-party.txt"
          for text in 'Mozilla Public License' 'The interpreter and its standard library' 'Bootloader Exception' '--- openssl'; do
            grep -q -- "$text" "$RUNNER_TEMP/agent-third-party.txt" || { echo "::error::Third-party notices lack: $text"; exit 1; }
          done
          test -s "$BIN.THIRD-PARTY-NOTICES.txt"
          shasum -a 256 "$BIN" | awk '{print $1}' > "$BIN.sha256"
          printf '%s\n' "$SIGNING_LINE" > "$BIN.SIGNING.txt"

      - name: Package and notarize
        if: steps.mac.outputs.mode == 'developer-id'
        working-directory: ${{ env.AGENT_DIR }}
        env:
          FADEN_MAC_INSTALLER_IDENTITY: ${{ secrets.FADEN_MAC_INSTALLER_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          sh macos-package.sh pkg
          sh macos-package.sh notarize

      - name: Remove the signing keychain and the notary key
        if: always()
        working-directory: ${{ env.AGENT_DIR }}
        run: sh macos-package.sh cleanup

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: faden-agent-macos-arm64
          path: |
            ${{ env.AGENT_DIR }}/dist/faden-agent-macos-arm64
            ${{ env.AGENT_DIR }}/dist/faden-agent-macos-arm64.sha256
            ${{ env.AGENT_DIR }}/dist/faden-agent-macos-arm64.THIRD-PARTY-NOTICES.txt
            ${{ env.AGENT_DIR }}/dist/faden-agent-macos-arm64.SIGNING.txt
            ${{ env.AGENT_DIR }}/dist/faden-agent-macos-arm64.pkg
            ${{ env.AGENT_DIR }}/dist/faden-agent-macos-arm64.pkg.sha256
          retention-days: 30

  release:
    needs: [version, build, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/node-agent-v')
    permissions:
      contents: write  # creates the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: How the Mac build is signed
        id: mac
        run: echo "line=$(cat artifacts/faden-agent-macos-arm64.SIGNING.txt)" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: node-agent-v${{ needs.version.outputs.version }}
          name: "Node Agent v${{ needs.version.outputs.version }}"
          generate_release_notes: true
          body: |
            Fadenstack-authored agent code is licensed under Apache-2.0.
            Bundled dependencies retain their own licenses: each binary's
            `.THIRD-PARTY-NOTICES.txt` carries their texts, and
            `faden-agent license --third-party` prints the same.

            Standalone agent binaries for Linux and for Macs with Apple Silicon, no
            Python needed. Machines normally get them through the install line on
            the Fadenstack **Machines → Add a machine** page, which checks the
            SHA-256 against the server's own copy.

            Linux builds are made in Debian bookworm (glibc 2.36), so they run on that
            and newer. The Mac build (`faden-agent-macos-arm64`, and a notarized
            `.pkg` when the release carries one) runs on macOS 26 and newer.

            ${{ steps.mac.outputs.line }}
          files: artifacts/*

  pypi:
    # The binaries above are what installs use; this must never hold them back.
    # Trusted publishing: PyPI accepts this job's OIDC token for this workflow
    # in the `pypi` environment, which only release tags may use.
    needs: [version, release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/node-agent-v')
    environment: pypi
    permissions:
      contents: read
      id-token: write  # PyPI's trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: agent
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build
        working-directory: ${{ env.AGENT_DIR }}
        run: |
          pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ env.AGENT_DIR }}/dist/
          # A release can be run again once the version is on PyPI.
          skip-existing: true

  sbom:
    needs: [version, release]
    if: startsWith(github.ref, 'refs/tags/node-agent-v')
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/sbom-release.yml
    with:
      kind: agent
      version: ${{ needs.version.outputs.version }}
      release_tag: ${{ github.ref_name }}
