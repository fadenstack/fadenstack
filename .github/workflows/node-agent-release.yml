# Build and release the node agent: the binaries the install line fetches.
#
# The backend's install plan points machines at
#   https://github.com/fadenstack/fadenstack/releases/download/node-agent-v<version>/faden-agent-<platform>
# for <platform> linux-x86_64 and linux-aarch64 (see
# backend/faden_backend/web/api/install/__init__.py, RELEASE_URL and AGENT_VERSION).
# This workflow makes exactly those files.
#
# Release:
#   1. Bump the version in agent/pyproject.toml and
#      agent/faden_agent/__init__.py, and AGENT_VERSION in
#      the backend -- the backend is what tells machines which agent to install.
#   2. Tag and push: git tag node-agent-v0.1.12 && git push origin node-agent-v0.1.12
#
# Each binary is built by build-binary.sh in a Debian bookworm container, on a
# runner of its own architecture: built on a newer distro, the agent links a
# newer glibc and fails on older nodes (the DGX Sparks run glibc 2.39; many
# servers run older).

name: Release Node Agent

on:
  workflow_dispatch:
  push:
    tags:
      - "node-agent-v*"

permissions:
  contents: read

env:
  AGENT_DIR: agent

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The tag, the agent and the backend agree on the version
        id: check
        shell: bash
        run: |
          set -euo pipefail
          PYPROJECT=$(python3 -c "import tomllib; print(tomllib.load(open('$AGENT_DIR/pyproject.toml','rb'))['project']['version'])")
          PACKAGE=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' "$AGENT_DIR/faden_agent/__init__.py")
          BACKEND=$(sed -n 's/^AGENT_VERSION = "\(.*\)"/\1/p' backend/faden_backend/web/api/install/__init__.py)
          echo "pyproject=$PYPROJECT package=$PACKAGE backend=$BACKEND"
          if [ "$PYPROJECT" != "$PACKAGE" ] || [ "$PYPROJECT" != "$BACKEND" ]; then
            echo "::error::Versions differ: pyproject $PYPROJECT, package $PACKAGE, backend AGENT_VERSION $BACKEND"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/node-agent-v* ]] && [ "${GITHUB_REF#refs/tags/node-agent-v}" != "$PYPROJECT" ]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match version $PYPROJECT"
            exit 1
          fi
          echo "version=$PYPROJECT" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: agent

      - name: Build
        working-directory: ${{ env.AGENT_DIR }}
        run: sh build-binary.sh ${{ matrix.platform }}

      - name: Smoke test
        working-directory: ${{ env.AGENT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/faden-agent-${{ matrix.platform }}"
          chmod +x "$BIN"
          # It must start, parse its arguments and print its licence -- in the
          # oldest environment it claims to support, not only on this runner.
          docker run --rm -v "$PWD/dist:/d:ro" debian:bookworm-slim "/d/faden-agent-${{ matrix.platform }}" license > "$RUNNER_TEMP/agent-license.txt"
          sed -n '1,5p' "$RUNNER_TEMP/agent-license.txt"
          grep -q 'Apache License' "$RUNNER_TEMP/agent-license.txt"
          grep -q 'license --third-party' "$RUNNER_TEMP/agent-license.txt"
          # And the licences of what it bundles: the packages (certifi is
          # MPL-2.0), Python, the Debian libraries, PyInstaller's bootloader.
          docker run --rm -v "$PWD/dist:/d:ro" debian:bookworm-slim "/d/faden-agent-${{ matrix.platform }}" license --third-party > "$RUNNER_TEMP/agent-third-party.txt"
          for text in 'Mozilla Public License' 'The interpreter and its standard library' 'libssl3' 'Bootloader Exception'; do
            grep -q "$text" "$RUNNER_TEMP/agent-third-party.txt" || { echo "::error::Third-party notices lack: $text"; exit 1; }
          done
          test -s "$BIN.THIRD-PARTY-NOTICES.txt"
          sha256sum "$BIN" | awk '{print $1}' > "$BIN.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: faden-agent-${{ matrix.platform }}
          path: |
            ${{ env.AGENT_DIR }}/dist/faden-agent-${{ matrix.platform }}
            ${{ env.AGENT_DIR }}/dist/faden-agent-${{ matrix.platform }}.sha256
            ${{ env.AGENT_DIR }}/dist/faden-agent-${{ matrix.platform }}.THIRD-PARTY-NOTICES.txt
          retention-days: 30

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/node-agent-v')
    permissions:
      contents: write  # creates the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: node-agent-v${{ needs.version.outputs.version }}
          name: "Node Agent v${{ needs.version.outputs.version }}"
          generate_release_notes: true
          body: |
            Fadenstack-authored agent code is licensed under Apache-2.0.
            Bundled dependencies retain their own licenses: each binary's
            `.THIRD-PARTY-NOTICES.txt` carries their texts, and
            `faden-agent license --third-party` prints the same.

            Standalone agent binaries for Linux, no Python needed. Machines normally
            get them through the install line on the Fadenstack **Machines → Add a
            machine** page, which checks the SHA-256 against the server's own copy.

            Built in Debian bookworm (glibc 2.36), so they run on that and newer.
          files: artifacts/*

  pypi:
    # The binaries above are what installs use; this must never hold them back.
    # Trusted publishing: PyPI accepts this job's OIDC token for this workflow
    # in the `pypi` environment, which only release tags may use.
    needs: [version, release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/node-agent-v')
    environment: pypi
    permissions:
      contents: read
      id-token: write  # PyPI's trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: agent
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build
        working-directory: ${{ env.AGENT_DIR }}
        run: |
          pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ env.AGENT_DIR }}/dist/
          # A release can be run again once the version is on PyPI.
          skip-existing: true

  sbom:
    needs: [version, release]
    if: startsWith(github.ref, 'refs/tags/node-agent-v')
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/sbom-release.yml
    with:
      kind: agent
      version: ${{ needs.version.outputs.version }}
      release_tag: ${{ github.ref_name }}
