services:
  api: &main_app
    build:
      context: .
      dockerfile: ./Dockerfile
    image: faden_mcp:${FADEN_MCP_VERSION:-latest}
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FADEN_MCP_HOST: 0.0.0.0
      FADEN_MCP_DB_HOST: faden_mcp-db
      FADEN_MCP_REDIS_HOST: faden_mcp-redis

  db:
    image: postgres:16
    hostname: "faden_mcp-db"
    restart: always
    environment:
      POSTGRES_PASSWORD: "llm_user"
      POSTGRES_USER: "llm_user"
      POSTGRES_DB: "faden_mcp"
    healthcheck:
      test: pg_isready -U llm_user -d faden_mcp
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: bitnami/redis:6.2.5
    hostname: "faden_mcp-redis"
    restart: always
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    healthcheck:
      test: redis-cli ping
      interval: 1s
      timeout: 3s
      retries: 50
